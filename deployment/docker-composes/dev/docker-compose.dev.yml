# Dev-стенд: api (миграции), db, отдельная БД и прогон интеграционных тестов, pgAdmin, nginx.
# Относительные пути считаются от этого каталога. Переменные ${...} — из корневого .env:
# manage/*.sh экспортируют его перед вызовом compose; при прямом вызове из корня —
# docker compose --env-file .env -f deployment/docker-composes/dev/docker-compose.dev.yml up
name: orders-service-dev

services:
  api:
    container_name: orders-dev-api
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: deployment/dockerfiles/Dockerfile
      target: development
    depends_on:
      db:
        condition: service_healthy
    # Внутри сети compose БД — сервис db на внутреннем порту; POSTGRES_HOST/PORT из .env
    # относятся к запуску с хоста
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    entrypoint: ["entrypoint_api.sh"]
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      # В slim-образе нет curl — проверка штатным python
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthcheck', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_dev_network
    env_file:
      - ../../../.env

  db:
    container_name: orders-dev-db
    restart: unless-stopped
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-dev:/var/lib/postgresql/data
    # Публикуется на хост ради локальных uv run uvicorn / alembic (в prod — только внутри сети)
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app_dev_network

  api_for_tests:
    container_name: orders-dev-api-tests
    build:
      context: ../../..
      dockerfile: deployment/dockerfiles/Dockerfile
      target: tests
    depends_on:
      db_for_tests:
        condition: service_healthy
    environment:
      TEST_POSTGRES_HOST: db_for_tests
      TEST_POSTGRES_PORT: "5432"
      API_ENV: development
    entrypoint: ["entrypoint_tests.sh"]
    networks:
      - app_dev_network
    env_file:
      - ../../../.env

  db_for_tests:
    container_name: orders-dev-test-db
    restart: unless-stopped
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    # Публикуется на хост ради локального uv run pytest; данные не хранятся (без volume)
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    networks:
      - app_dev_network

  pgadmin:
    container_name: orders-dev-pgadmin4
    restart: unless-stopped
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - dev-pgadmin-data:/var/lib/pgadmin
    networks:
      - app_dev_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: orders-dev-nginx
    restart: always
    image: nginx:1.28-alpine
    depends_on:
      - api
      - pgadmin
    volumes:
      - ../../nginx_config/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_EXTERNAL_PORT:-8080}:80"
    networks:
      - app_dev_network

volumes:
  db-dev:
  dev-pgadmin-data:

networks:
  app_dev_network:
    driver: bridge
