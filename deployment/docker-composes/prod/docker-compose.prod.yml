# Production-стенд: наружу опубликован только nginx; api стартует после успешного прогона
# интеграционных тестов (api_for_tests). Относительные пути считаются от этого каталога,
# переменные ${...} — из корневого .env (см. manage/*.sh).
name: orders-service

services:
  api:
    container_name: orders-api
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: deployment/dockerfiles/Dockerfile
      target: production
    depends_on:
      db:
        condition: service_healthy
      api_for_tests:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    entrypoint: ["entrypoint_api.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthcheck', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network
    env_file:
      - ../../../.env

  db:
    container_name: orders-db
    restart: unless-stopped
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - app_network

  api_for_tests:
    container_name: orders-api-tests
    build:
      context: ../../..
      dockerfile: deployment/dockerfiles/Dockerfile
      target: tests
    depends_on:
      db_for_tests:
        condition: service_healthy
    environment:
      TEST_POSTGRES_HOST: db_for_tests
      TEST_POSTGRES_PORT: "5432"
      API_ENV: production
    entrypoint: ["entrypoint_tests.sh"]
    networks:
      - app_network
    env_file:
      - ../../../.env

  db_for_tests:
    container_name: orders-test-db
    restart: unless-stopped
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    expose:
      - "5432"
    networks:
      - app_network

  pgadmin:
    container_name: orders-pgadmin4
    restart: unless-stopped
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: orders-nginx
    restart: always
    image: nginx:1.28-alpine
    depends_on:
      - api
      - pgadmin
    volumes:
      - ../../nginx_config/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_EXTERNAL_PORT:-8080}:80"
    networks:
      - app_network

volumes:
  db:
  pgadmin-data:

networks:
  app_network:
    driver: bridge
