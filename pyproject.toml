[project]
name = "orders-service"
version = "0.1.0"
description = "Учебный сервис заказов: гексагональная архитектура, SOLID, GoF, Unit of Work"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.143.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.0",
    # extra asyncio обязателен: без greenlet не импортируется sqlalchemy.ext.asyncio
    "python-json-logger>=4.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.45.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Пакет собирается в wheel на стадии builder Dockerfile (uv sync --no-editable)
[tool.hatch.build.targets.wheel]
packages = ["orders_service"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations — обязательные type hints
    "S",    # flake8-bandit — security checks
    "D",    # pydocstyle — докстринги Google-стиля у всех классов и функций
]
ignore = [
    "B008",   # FastAPI Query/Body/Path в дефолтах — стандартный паттерн
    "RUF001", # кириллица в строках — русскоязычный проект
    "RUF002", # кириллица в докстрингах
    "RUF003", # кириллица в комментариях
]

[tool.ruff.lint.per-file-ignores]
# В тестах стиль hex_arch: классы и функции без докстрингов, комментарии Setup/Call/Assert.
"tests/**/*.py" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
